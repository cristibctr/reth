[package]
name = "reth-rpc-api-testing-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Reth RPC testing helpers"

[lints]
workspace = true

[dependencies]
# reth
reth-primitives.workspace = true
reth-rpc-api = { workspace = true, features = ["client"] }

# ethereum
alloy-primitives.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-trace.workspace = true
alloy-eips.workspace = true

# async
futures.workspace = true

# misc
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonrpsee = { workspace = true, features = ["client", "async-client"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
jsonrpsee = { workspace = true, features = ["wasm-client", "async-wasm-client"] }
serde_json.workspace = true

# assertions
similar-asserts.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "rt"] }
reth-rpc-eth-api.workspace = true
jsonrpsee-http-client.workspace = true
alloy-rpc-types-trace.workspace = true
